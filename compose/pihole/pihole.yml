services:
  pihole:
    container_name: piholev6
    image: pihole/pihole:latest
    hostname: piholev6
    networks:
      piholev6-net:
        ipv4_address: 192.168.100.100    #Change to your IP address in your network, make sure macvlan network is created.
        ipv6_address: fe80:dead:beef::100
#      piholeunbound-net:
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'America/Mexico_City'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: 'CHANGEME'  #Change this to your secure password
#      FTLCONF_dns_upstreams: 'unbound#5335'    #Make sure this matches your container name. In my case unbound as it is below.
    # Volumes store your data between container upgrades
    volumes:
      - /srv/mergerfs/mergpool/appdata/pihole/etc-pihole:/etc/pihole
      - /srv/mergerfs/mergpool/appdata/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    cap_add:
      - NET_ADMIN # Required if you are using Pi-hole as your DHCP server, else not needed
    restart: unless-stopped
#    depends_on:
#      - unbound

