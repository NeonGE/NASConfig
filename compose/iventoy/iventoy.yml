# iventoy
# PXE Server
services:
  iventoy:
    image: ziggyds/iventoy:latest
    container_name: iventoy
    restart: always
    privileged: true
    ports:
      # Required ports for Web UI, PXE, DHCP, and TFTP
      - "26000:26000"
      - "16000:16000"
      - "67:67/udp"
      - "69:69/udp"
    volumes:
      # Map host folders to container paths
      - /srv/mergerfs/mergpool/iso:/app/iso # Keep your ISO location
      # >>> CHANGE THIS LINE: Use a named volume for the data <<<
      - iventoy_data:/app/data
      - /srv/mergerfs/mergpool/appdata/iventoy/log:/app/log # Keep logs location
    environment:
      - AUTO_START_PXE=true
    networks:
      iventoy-net:
        ipv4_address: 192.168.100.110

networks:
  iventoy-net:
    name: local-network
    external: true

# >>> ADD THIS SECTION at the bottom to define the new named volume <<<
volumes:
  iventoy_data:
    driver: local
