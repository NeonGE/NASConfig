# audiomuse-ai
# Audio Analyzer
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ${APPDATA_DIR}/redis:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${APPDATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  audiomuse-ai-flask:
    image: ghcr.io/neptunehub/audiomuse-ai:${AUDIOMUSE_TAG}
    dns:
      - 8.8.8.8
    ports:
      - "${FRONTEND_PORT}:8000"
    environment:
      SERVICE_TYPE: flask
      TZ: ${TZ}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /app/temp_audio
    volumes:
      - ${APPDATA_DIR}/temp-flask:/app/temp_audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  audiomuse-ai-worker:
    image: ghcr.io/neptunehub/audiomuse-ai:${AUDIOMUSE_TAG}
    environment:
      SERVICE_TYPE: worker
      TZ: ${TZ}

      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      REDIS_URL: redis://redis:6379/0
      TEMP_DIR: /app/temp_audio
    volumes:
      - ${APPDATA_DIR}/temp-worker:/app/temp_audio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
